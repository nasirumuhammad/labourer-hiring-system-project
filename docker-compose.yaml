services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      network: host
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    environment:
      NODE_ENV: production
      API_URL: http://api:5000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      network: host
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labour-hiring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labour-hiring"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
