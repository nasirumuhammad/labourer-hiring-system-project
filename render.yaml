services:
  # ---------- Redis (BullMQ) ----------
  - type: keyvalue
    name: labourer-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal access only

  # ---------- NestJS API ----------
  - type: web
    name: labourer-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"

      # Postgres
      - key: DB_HOST
        fromDatabase:
          name: labourer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: labourer-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: labourer-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: labourer-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: labourer-db
          property: database

      # Redis
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: labourer-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: labourer-redis
          property: port

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: JWT_RESET_SECRET
        generateValue: true
      - key: JWT_RESET_EXPIRY
        value: 15m

      # Seeded admin account (you will be asked for these on first deploy)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Email (Resend) - leave blank/skip if you don't need OTP emails yet
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_EMAIL
        sync: false

  # ---------- Next.js web ----------
  - type: web
    name: labourer-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Public URL of the API, e.g. https://labourer-api.onrender.com
      # (no trailing slash). Used at build time AND runtime.
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Must match the API's JWT_SECRET (proxy.ts verifies tokens with it)
      - key: JWT_SECRET
        fromService:
          type: web
          name: labourer-api
          envVarKey: JWT_SECRET

# ---------- Postgres ----------
databases:
  - name: labourer-db
    plan: free
    region: oregon
    databaseName: labour_hiring
    user: labour_user
