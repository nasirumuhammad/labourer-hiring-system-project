services:
  # ---------- NestJS API ----------
  - type: web
    name: labourer-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"

      # Postgres (Supabase). Use the SESSION POOLER values from
      # Supabase > Connect > Session pooler (IPv4-compatible, port 5432):
      #   DB_HOST     aws-0-<region>.pooler.supabase.com
      #   DB_PORT     5432
      #   DB_USERNAME postgres.<project-ref>
      #   DB_NAME     postgres
      # The direct host (db.<ref>.supabase.co) is IPv6-only on the free tier.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: postgres
      - key: DB_SSL
        value: "true"

      # Redis (external provider). Use the TLS URL, e.g. for Upstash:
      # rediss://default:<URL-ENCODED-PASSWORD>@<host>.upstash.io:6379
      - key: REDIS_URL
        sync: false

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: JWT_RESET_SECRET
        generateValue: true
      - key: JWT_RESET_EXPIRY
        value: 15m

      # Seeded admin account (you will be asked for these on first deploy)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Email (Resend) - leave blank/skip if you don't need OTP emails yet
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_EMAIL
        sync: false

  # ---------- Next.js web ----------
  - type: web
    name: labourer-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Public URL of the API, e.g. https://labourer-api.onrender.com
      # (no trailing slash). Used at build time AND runtime.
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Must match the API's JWT_SECRET (proxy.ts verifies tokens with it)
      - key: JWT_SECRET
        fromService:
          type: web
          name: labourer-api
          envVarKey: JWT_SECRET
